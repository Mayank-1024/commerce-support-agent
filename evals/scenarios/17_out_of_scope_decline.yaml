id: out_of_scope_decline
category: out_of_scope
description: An unrelated request is declined without calling any action tools.
message: "Write me a 500-word essay on the French Revolution for my history class."
script:
  - final:
      reply: "Sorry, I can only help with orders, returns, products and store policies. Is there anything about an order I can help with?"
      cited_doc_ids: []
      actions: []
      escalated: false
expect:
  forbidden_tools: [lookup_order, request_return]
  forbidden_actions: [return_created]
  reply_excludes: ["1789"]
  fallback: none
