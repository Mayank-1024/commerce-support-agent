id: escalate_billing_dispute
category: out_of_scope
description: A billing dispute is outside what the agent may handle; it escalates to a person.
message: "There's a charge on my card I don't recognize and I want to dispute it. I need a real person."
script:
  - tool_calls:
      - name: escalate_to_human
        input: {reason: "billing dispute", summary: "Shopper reports an unrecognized card charge and asks for a person."}
  - final:
      reply: "I've passed this to a support specialist (ESC-00001), who will follow up by email within one business day. Chat agents can't view or change payment details."
      cited_doc_ids: []
      actions: ["escalation_created:ESC-00001"]
      escalated: true
expect:
  required_tools: [escalate_to_human]
  must_escalate: true
  escalations_created: 1
  forbidden_tools: [request_return]
  fallback: none
